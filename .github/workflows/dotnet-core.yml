name: .NET

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore library
        run: dotnet restore Canducci.MongoDB.Repository/Canducci.MongoDB.Repository.csproj
      - name: Build all library target frameworks
        run: dotnet build Canducci.MongoDB.Repository/Canducci.MongoDB.Repository.csproj --configuration Release --no-restore
      - name: Restore tests
        run: dotnet restore Canducci.MongoDB.Repository.UnitTest/Canducci.MongoDB.Repository.UnitTest.csproj
      - name: Test
        run: dotnet test Canducci.MongoDB.Repository.UnitTest/Canducci.MongoDB.Repository.UnitTest.csproj --configuration Release --no-restore
